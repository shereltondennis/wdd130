<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Discover the history of White Water Rafting Company.
     Join us for thrilling river trips and expert-led expeditions. Book your adventure today!">
    <meta name="author" content="Sherelton B Dennis">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Rush Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/logo.jpg" alt="Logo" class="logo">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </nav>
    </header>
<main>

    <section class="contact-header">
        <p>White Water Rafting</p>
        <p>Tele: (231) 776-109-240</p>
        <p>Email: <a href="mailto:shereltondennis@example.com">shereltondennis@example.com</a></p>
    </section>

    <div class="contact-grid">
        </div>

    <div class="contact-grid">
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?..."></iframe>
        </div>
    <form action="/submit-form" method="POST">
  <div class="form-group" style="margin-bottom: 15px;">
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="user_name" required style="width: 100%; max-width: 300px;">
  </div>

  <div class="form-group">
    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="user_email" required style="width: 100%; max-width: 300px;">
  </div>

  <div class="form-group">
    <label>Message Purpose:</label>
    <div class="radio-group">
        <label>
            <input type="radio" name="purpose" value="general" checked> General Inquiry
        </label>
        <label>
            <input type="radio" name="purpose" value="reservation"> Reservation Question
        </label>
        <label>
            <input type="radio" name="purpose" value="suggestion"> Website Suggestion
        </label>
    </div>
</div>

  <div class="form-group">
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="5" style="width: 100%; max-width: 400px;" required></textarea>
  </div>

  <div class="form-group" style="margin-bottom: 15px;">
    <input type="checkbox" id="newsletter" name="subscribe" value="yes">
    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
  </div>

  <button type="submit">Submit Request</button>
</form>

</div>
</main>

    <footer>
        <p>&copy; 2026 Whitewater Adventures | Sherelton B Dennis</p>

            <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
        </nav>
    </footer>
</body>
</html>
