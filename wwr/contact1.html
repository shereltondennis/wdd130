<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Discover the history of White Water Rafting Company.
     Join us for thrilling river trips and expert-led expeditions. Book your adventure today!">
    <meta name="author" content="Sherelton B Dennis">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Rush Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/logo.jpg" alt="Logo" class="logo">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </nav>
    </header>
<main>
    <section class="contact-header">
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>+1 999 999 9999</p>
        <p>Email: <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
    </section>

    <div class="contact-grid">
        
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1000!2d0!3d0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v123456789" 
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>

        <form action="/submit-form" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="user_name" placeholder="Placeholder" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="user_email" placeholder="Placeholder" required>
            </div>

            <div class="form-group">
                <label>Message Purpose</label>
                <div class="radio-group">
                    <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="subscribe" value="yes" checked> 
                    Please Subscribe me to the monthly newsletter
                </label>
            </div>

            <button type="submit">Get in Touch!</button>
        </form>
    </div>
</main>

    <footer>
        <p>&copy; 2026 Whitewater Adventures | Sherelton B Dennis</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
        </nav>
    </footer>
</body>
</html>
