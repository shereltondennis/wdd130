<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Contact White Water Rafting to ask questions and plan your next river adventure.">
    <meta name="author" content="Sherelton B Dennis">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/logo.png" alt="White Water Rafting company logo">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html" aria-current="page">Contact Us</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="contact-header">
            <h1>Contact Us</h1>
            <p>Phone: (555) 123-4567</p>
            <p>Email: info@whitewateradventures.com</p>
            <p>Address: 123 River Run Road, Rapids Valley, ID</p>
        </section>

        <section class="contact-grid">
            <div class="map">
                <img src="images/rafting05.jpg" alt="Map placeholder for White Water Rafting location in Idaho">
                <p>Location reference: Rapids Valley, Idaho</p>
            </div>

            <form action="#" method="post">
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <fieldset>
                    <legend>Purpose of Message</legend>
                    <div class="form-item">
                        <input type="radio" id="purpose-general" name="purpose" value="general" required>
                        <label for="purpose-general">General Inquiry</label>
                    </div>
                    <div class="form-item">
                        <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                        <label for="purpose-reservation">Reservation Question</label>
                    </div>
                    <div class="form-item">
                        <input type="radio" id="purpose-website" name="purpose" value="website">
                        <label for="purpose-website">Website Suggestion</label>
                    </div>
                </fieldset>
                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                <div class="form-item">
                    <input type="checkbox" id="newsletter-optin" name="newsletter-optin">
                    <label for="newsletter-optin">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Adventures | Sherelton B Dennis</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook social media icon"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram social media icon"></a>
            <a href="#"><img src="images/linkedin.png" alt="LinkedIn social media icon"></a>
        </nav>
    </footer>
</body>
</html>
