

    <main>
        <form action="/submit-feedback" method="post">
            
            <!-- ✅ At least one <input type="text"> -->
            <!-- ✅ Associated <label> -->
            <!-- ✅ name and id attributes -->
            <div>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <!-- ✅ Exactly three <input type="radio"> buttons (same name) -->
            <!-- ✅ Associated <label> -->
            <!-- ✅ name and id attributes -->
            <fieldset>
                <legend>Rate your experience:</legend>
                <input type="radio" id="rating1" name="experience" value="good" checked>
                <label for="rating1">Good</label><br>
                
                <input type="radio" id="rating2" name="experience" value="average">
                <label for="rating2">Average</label><br>
                
                <input type="radio" id="rating3" name="experience" value="poor">
                <label for="rating3">Poor</label>
            </fieldset>

            <!-- ✅ One <textarea> -->
            <!-- ✅ Associated <label> -->
            <!-- ✅ name and id attributes -->
            <div>
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" rows="4" cols="50"></textarea>
            </div>

            <!-- ✅ One <input type="checkbox"> -->
            <!-- ✅ Associated <label> -->
            <!-- ✅ name and id attributes -->
            <div>
                <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                <label for="subscribe">Subscribe to newsletter</label>
            </div>

            <!-- ✅ One <button type="submit"> with meaningful content -->
            <button type="submit">Send Feedback</button>

        </form>
    </main>

</body>
</html>
