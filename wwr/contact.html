<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Discover the history of White Water Rafting Company.Join us for thrilling river trips and expert-led expeditions. Book your adventure today!">
    <meta name="author" content="Sherelton B Dennis">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/logo.jpg" alt="Logo" class="logo">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </nav>
    </header>
<main>
    <section class="contact-header">
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street, Kolob, California</p>
        <p>Tele: (231) 776-109-240</p>
        <p>Email: <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
    </section>

    <div class="contact-grid">
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?..." allowfullscreen="" loading="lazy"></iframe>
        </div> <form action="/submit-form" method="POST">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="user_name" placeholder="Placeholder" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="user_email" placeholder="Placeholder" required>
            </div>

            <div class="form-group">
                <label>Message Purpose:</label>
                <div class="radio-group">
                    <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>

            <div class="form-group">
                <input type="checkbox" id="newsletter" name="subscribe" value="yes">
                <label for="newsletter">Please subscribe me to the monthly newsletter</label>
            </div>

            <button type="submit">Join the Mailing List!</button>
        </form>
    </div>
    <section>
        <h2>Adventure Awaits You!</h2>
        <div class="gallery">
            <figure>
                <img src="images/rafting02.jpg" alt="Rapid">
                <figcaption>Thrilling Rapids</figcaption>
            </figure>
            <figure>
                <img src="images/rafting03.jpg" alt="Scenery">
                <figcaption>Beautiful Scenery</figcaption>
            </figure>
            <figure>
                <img src="images/rafting04.jpg" alt="Waters">
                <figcaption>Peaceful Waters</figcaption>
            </figure>
            <figure>
                <img src="images/rafting05.jpg" alt="Family">
                <figcaption>Family Fun</figcaption>
            </figure>
            <figure>
                <img src="images/rafting01.jpg" alt="Experience">
                <figcaption>Experience</figcaption>
            </figure>
        </div>
    </section>

</main>

    <footer>
        <p>&copy; 2026 Whitewater Adventures | Sherelton B Dennis</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
        </nav>
    </footer>
</body>
</html>
